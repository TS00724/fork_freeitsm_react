<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>FreeITSM React architecture review</title>
    <script>
      // Public, non-secret defaults only. A future thin PHP/static host may inject
      // window.__FREEITSM_RUNTIME_CONFIG__ before this block. No BFF exists in WP-03.
      window.__FREEITSM_RUNTIME_CONFIG__ =
        window.__FREEITSM_RUNTIME_CONFIG__ || {
          baseUrl: '/',
          appPath: 'ui/',
          apiBaseUrl: 'api/ui/v1/',
          locale: 'en',
          timezone: 'UTC',
          colorMode: 'light'
        };

      // Vite emits relative asset URLs. An early <base> keeps those URLs stable when
      // a server falls back to this document for a nested BrowserRouter route.
      (function installRuntimeBase() {
        var config = window.__FREEITSM_RUNTIME_CONFIG__;
        var controlOrBackslash = /[\\\u0000-\u001f\u007f]/;

        function safePath(value, fallback, label) {
          var raw = String(value || fallback).trim();
          if (
            controlOrBackslash.test(raw) ||
            raw.indexOf('?') !== -1 ||
            raw.indexOf('#') !== -1 ||
            /^\/\//.test(raw) ||
            /^[a-z][a-z\d+.-]*:/i.test(raw)
          ) {
            throw new Error(label + ' must be a same-origin URL path');
          }

          raw.split('/').forEach(function rejectDotSegment(segment) {
            var decoded = segment;
            for (var pass = 0; pass < 3; pass += 1) {
              var next;
              try {
                next = decodeURIComponent(decoded);
              } catch (_error) {
                throw new Error(label + ' contains invalid URL encoding');
              }
              if (next === decoded) break;
              decoded = next;
            }
            if (decoded === '.' || decoded === '..' || /[\\/]/.test(decoded)) {
              throw new Error(label + ' must not contain path traversal');
            }
          });
          return raw;
        }

        var basePath = safePath(config.baseUrl, '/', 'baseUrl');
        var baseUrl = new URL(basePath, window.location.origin + '/');
        if (baseUrl.origin !== window.location.origin) {
          throw new Error('baseUrl must remain same-origin');
        }
        baseUrl.pathname = baseUrl.pathname.replace(/\/+$/, '') + '/';

        var appPath = safePath(config.appPath, 'ui/', 'appPath').replace(/^\/+|\/+$/g, '');
        var appUrl = new URL(appPath ? appPath + '/' : './', baseUrl);
        if (!appUrl.pathname.startsWith(baseUrl.pathname)) {
          throw new Error('appPath must remain below baseUrl');
        }

        var base = document.createElement('base');
        base.href = appUrl.href;
        document.head.appendChild(base);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>JavaScript is required to review the React application shell.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
